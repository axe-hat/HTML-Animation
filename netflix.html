<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Netflix logo animation built with pure CSS3 keyframes and transforms">
        <title>Netflix Logo Animation</title>
        <link rel="stylesheet" href="css/netflix.css">
    </head>
    <body>
        <main aria-label="Netflix logo animation">
            <div class="netflix" role="img" aria-label="Animated Netflix logo with three vertical bars">
                <span class="left" aria-hidden="true"></span>
                <span class="center" aria-hidden="true"></span>
                <span class="right" aria-hidden="true"></span>
            </div>
        </main>
    </body>
</html>
